# Builds the site and uploads dist/ to Hostatom over FTP on every push to main.
#
# Setup (GitHub → Settings → Secrets and variables → Actions):
#   Secrets:   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   Variable:  FTP_SERVER_DIR  (optional, default ./public_html/ —
#              DirectAdmin accounts often need ./domains/earthcha.com/public_html/)
# Until the secrets exist, the build still runs but the upload step is skipped.

name: Deploy to Hostatom

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Upload to Hostatom
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || './public_html/' }}

      - name: FTP not configured yet
        if: env.FTP_SERVER == ''
        run: echo "::warning::FTP secrets are not set — built the site but skipped the upload."
